{{- if .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  endpointSelector:
    matchLabels:
      app: {{ .Release.Name }}
  enableDefaultDeny:
    ingress: true # nothing gets in except the web terminal below (kubectl exec doesn't go over the pod network)
    egress: true
  {{- if .Values.web.enabled }}
  ingress:
    - fromEndpoints:
        {{- range .Values.web.allowFrom }}
        - matchLabels:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: "7681"
              protocol: TCP
            {{- if .Values.web.files.enabled }}
            - port: "8080"
              protocol: TCP
            {{- end }}
  {{- end }}
  egress:
    # DNS via the proxy, which is also what lets toFQDNs learn IPs.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    {{- if .Values.s3.enabled }}
    - toEndpoints:
        - matchLabels:
            app: {{ .Release.Name }}-s3
      toPorts:
        - ports:
            - port: "3900"
              protocol: TCP
    {{- end }}
    {{- range .Values.egress.services }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
            {{- toYaml .labels | nindent 12 }}
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
    {{- end }}
    {{- range .Values.egress.fqdns }}
    - toFQDNs:
        - {{- toYaml (omit . "ports") | nindent 10 }}
      toPorts:
        - ports:
            {{- range (.ports | default (list 443)) }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- with .Values.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
