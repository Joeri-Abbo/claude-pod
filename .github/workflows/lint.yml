name: lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: helm lint --strict .
      - name: check web ingress TLS enforcement
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          tls = "traefik.ingress.kubernetes.io/router.tls"
          entrypoints = "traefik.ingress.kubernetes.io/router.entrypoints"

          def render(ingress):
              return subprocess.run(
                  ["helm", "template", "t", ".", "--show-only", "templates/web.yaml", "-f", "-"],
                  input=json.dumps({"web": {"enabled": True, "ingress": ingress}}),
                  text=True, capture_output=True,
              )

          for class_name in ("", "traefik"):
              for overrides in ({}, {tls: "false", entrypoints: "web,websecure"}):
                  ingress = dict(enabled=True, className=class_name, host="claude.example.com",
                                 tlsSecretName="claude-tls", annotations={
                                     "cert-manager.io/cluster-issuer": "letsencrypt", **overrides})
                  result = render(ingress)
                  assert result.returncode == 0, result.stderr
                  assert f'{tls}: "true"' in result.stdout, result.stdout
                  assert f'{entrypoints}: websecure' in result.stdout, result.stdout
                  assert "cert-manager.io/cluster-issuer: letsencrypt" in result.stdout
                  assert "path: /files" in result.stdout and "path: /\n" in result.stdout

          ingress = dict(enabled=True, className="traefik", host="claude.example.com")
          result = render(ingress)
          assert result.returncode != 0 and "tlsSecretName is required" in result.stderr
          result = render({**ingress, "allowInsecure": True,
                           "annotations": {tls: "false", entrypoints: "web"}})
          assert result.returncode == 0, result.stderr
          assert f'{tls}: "false"' in result.stdout and f'{entrypoints}: web\n' in result.stdout
          assert "secretName:" not in result.stdout
          PY
      - name: install kubeconform
        run: curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: render and validate every s3 / networkPolicy / web combination
        run: |
          web="--set web.enabled=true --set web.ingress.enabled=true --set web.ingress.host=claude.example.com --set web.ingress.tlsSecretName=claude-tls"
          for args in "" \
            "$web" \
            "$web --set web.files.enabled=false --set s3.enabled=false" \
            "$web --set networkPolicy.enabled=false" \
            "--set s3.enabled=false" \
            "--set networkPolicy.enabled=false" \
            "--set s3.enabled=false --set networkPolicy.enabled=false" \
            "--set egress.fqdns[0].matchName=github.com --set egress.fqdns[1].matchPattern=*.npmjs.org --set egress.services[0].namespace=x --set egress.services[0].labels.app=x --set egress.services[0].port=1"; do
            echo "::group::helm template $args"
            # shellcheck disable=SC2086 # $args is a list of flags
            helm template t . $args | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
            echo "::endgroup::"
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck bin/claude-pod files/s3sync

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
